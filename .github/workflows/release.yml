name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIRNAME="quadlet-manager-${VERSION}"
          STAGING="/tmp/${DIRNAME}"
          mkdir -p "${STAGING}"
          cp -a dist node_modules package.json velojs "${STAGING}/"
          tar czf "/tmp/quadlet-manager-${VERSION}-linux-x64.tar.gz" -C /tmp "${DIRNAME}"

          # Bake version into install.sh
          sed -i "s/^VERSION=\"0.0.0\"/VERSION=\"${VERSION}\"/" install.sh

          gh release upload "${GITHUB_REF_NAME}" \
            "/tmp/quadlet-manager-${VERSION}-linux-x64.tar.gz" \
            install.sh \
            setup.sh
